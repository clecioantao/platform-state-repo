apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: postgres-dev
  labels:
    idp.platform.io/provider: kubernetes
    idp.platform.io/env: dev
spec:
  compositeTypeRef:
    apiVersion: idp.platform.io/v1alpha1
    kind: XPostgresInstance

  mode: Pipeline
  pipeline:
    - step: render-resources
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: postgres-secret
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef:
                  name: incluster
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Secret
                    metadata:
                      name: placeholder
                      namespace: placeholder
                    type: Opaque
                    stringData:
                      username: postgres
                      password: postgres
                      database: appdb
            patches:
              # ✅ Namespace vem do claimRef.namespace (apps-dev)
              - type: FromCompositeFieldPath
                fromFieldPath: spec.claimRef.namespace
                toFieldPath: spec.forProvider.manifest.metadata.namespace

              # ✅ Nome do Secret baseado no app
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.app
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      fmt: "%s-pg-secret"

          - name: postgres-service
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef:
                  name: incluster
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Service
                    metadata:
                      name: placeholder
                      namespace: placeholder
                    spec:
                      selector:
                        app: placeholder
                      ports:
                        - name: postgres
                          port: 5432
                          targetPort: 5432
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.claimRef.namespace
                toFieldPath: spec.forProvider.manifest.metadata.namespace

              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.app
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      fmt: "%s-postgres"

              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.app
                toFieldPath: spec.forProvider.manifest.spec.selector.app

          - name: postgres-statefulset
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef:
                  name: incluster
                forProvider:
                  manifest:
                    apiVersion: apps/v1
                    kind: StatefulSet
                    metadata:
                      name: placeholder
                      namespace: placeholder
                    spec:
                      serviceName: placeholder
                      replicas: 1
                      selector:
                        matchLabels:
                          app: placeholder
                      template:
                        metadata:
                          labels:
                            app: placeholder
                        spec:
                          containers:
                            - name: postgres
                              image: postgres:16
                              ports:
                                - containerPort: 5432
                                  name: postgres
                              env:
                                - name: POSTGRES_USER
                                  value: postgres
                                - name: POSTGRES_PASSWORD
                                  value: postgres
                                - name: POSTGRES_DB
                                  value: appdb
                              volumeMounts:
                                - name: data
                                  mountPath: /var/lib/postgresql/data
                      volumeClaimTemplates:
                        - metadata:
                            name: data
                          spec:
                            accessModes: ["ReadWriteOnce"]
                            resources:
                              requests:
                                storage: 1Gi
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.claimRef.namespace
                toFieldPath: spec.forProvider.manifest.metadata.namespace

              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.app
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      fmt: "%s-postgres"

              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.app
                toFieldPath: spec.forProvider.manifest.spec.serviceName
                transforms:
                  - type: string
                    string:
                      fmt: "%s-postgres"

              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.app
                toFieldPath: spec.forProvider.manifest.spec.selector.matchLabels.app

              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.app
                toFieldPath: spec.forProvider.manifest.spec.template.metadata.labels.app
