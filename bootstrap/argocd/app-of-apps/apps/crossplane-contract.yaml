apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-contract
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: platform
  source:
    repoURL: https://github.com/clecioantao/platform-state-repo.git
    targetRevision: main
    path: bootstrap/crossplane/contract
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
