apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: flask-app-standard
  title: "Create App: Flask (Standard) v7"
  description: "Cria um novo repositório da aplicação (Flask) e abre PR no platform-state-repo criando a estrutura GitOps vinculada."
  tags:
    - flask
    - idp
    - gitops

spec:
  owner: group:default/platform-team
  type: service

  parameters:
    - title: "Dados da Aplicação"
      required: ["component_id", "owner", "repoUrl", "environment"]
      properties:
        component_id:
          title: "Nome (slug)"
          type: string
          description: "ex: payments-api"
          ui:field: EntityNamePicker
        description:
          title: "Descrição"
          type: string
        owner:
          title: "Owner"
          type: string
          ui:field: OwnerPicker
          ui:options:
            allowedKinds: ["Group"]
        environment:
          title: "Ambiente inicial"
          type: string
          enum: ["dev", "prod"]
          default: "dev"
        repoUrl:
          title: "Repositório da aplicação"
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts: ["github.com"]

    - title: "GitOps (State Repo)"
      required: ["stateRepoUrl"]
      properties:
        stateRepoUrl:
          title: "State Repo (GitOps)"
          type: string
          description: "Repo onde os manifests GitOps serão versionados"
          default: "github.com?owner=clecioantao&repo=platform-state-repo"

  steps:
    - id: fetch_app_skeleton
      name: "Gerar skeleton do repo da aplicação"
      action: fetch:template
      input:
        url: ./skeleton
        values:
          component_id: ${{ parameters.component_id }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}

    - id: publish_app
      name: "Publicar repositório da aplicação"
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        defaultBranch: main

    - id: debug_publish_output
      name: "Debug publish output"
      action: debug:log
      input:
        message: |
          remoteUrl=${{ steps.publish_app.output.remoteUrl }}
          repoContentsUrl=${{ steps.publish_app.output.repoContentsUrl }}

    - id: register_app
      name: "Registrar app no catálogo"
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish_app.output.repoContentsUrl }}
        catalogInfoPath: "/catalog-info.yaml"

    # GitOps / State Repo
    - id: fetch_gitops_skeleton
      action: fetch:template
      input:
        url: ./skeleton-gitops/gitops
        targetPath: out
        values:
          component_id: ${{ parameters.component_id }}
          owner: ${{ parameters.owner }}
          env: ${{ parameters.environment }}

    - id: pr_state_repo
      name: "Abrir PR no platform-state-repo (criar diretório da app)"
      action: publish:github:pull-request
      input:
        repoUrl: ${{ parameters.stateRepoUrl }}
        branchName: backstage/create-app-${{ parameters.component_id }}-${{ parameters.environment }}
        title: "GitOps: create app folder ${{ parameters.component_id }} (${{ parameters.environment }})"
        description: |
          Cria estrutura GitOps da app no state repo.
          App repo: ${{ steps.publish_app.output.remoteUrl }}
        targetPath: apps/${{ parameters.environment }}/${{ parameters.component_id }}
        sourcePath: .
        token: ${{ secrets.GITHUB_TOKEN }}

  output:
    links:
      - title: "Repo da Aplicação"
        url: ${{ steps.publish_app.output.remoteUrl }}
      - title: "Entidade no Catálogo"
        icon: catalog
        entityRef: ${{ steps.register_app.output.entityRef }}
      - title: "PR no platform-state-repo"
        url: ${{ steps.pr_state_repo.output.remoteUrl }}
